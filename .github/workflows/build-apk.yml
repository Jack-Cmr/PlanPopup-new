name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 注意：下面这行加上了 cd PlanPopup
      - name: Give gradlew permission
        run: cd PlanPopup && chmod +x ./gradlew

      # 注意：这里也加上了 cd PlanPopup
      - name: Build APK
        run: cd PlanPopup && ./gradlew assembleDebug --stacktrace

      # 注意：上传的路径也要加上 PlanPopup/ 前缀
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: PlanPopup/app/build/outputs/apk/debug/app-debug.apk
